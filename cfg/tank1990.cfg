MEMORY {
    HEADER:  start = $0000, size = $0010, file = %O, fill = yes;
    TANK_LEVELS:    start = $8000, size = $2553, file = %O, fill = yes;
    PRG0_REST:      start = $A553, size = $1AAD, file = %O, fill = yes, fillval = $FF;
    PRG1_LO:        start = $C000, size = $3022, file = %O, fill = yes, fillval = $FF;
    CLASSIC_PREFIX: start = $F022, size = $000E, file = %O, fill = yes;
    CLASSIC_LEVELS: start = $F030, size = $0CCC, file = %O, fill = yes;
    PRG1_HI:        start = $FCFC, size = $0304, file = %O, fill = yes, fillval = $FF;
    CHR0:    start = $0000, size = $1000, file = %O, fill = yes;
    CHR1:    start = $1000, size = $1000, file = %O, fill = yes;
}

SEGMENTS {
    HEADER:  load = HEADER,  type = ro;
    TANK_LEVELS:    load = TANK_LEVELS,    type = ro;
    PRG0_REST:      load = PRG0_REST,      type = ro;
    PRG1_LO:        load = PRG1_LO,        type = ro;
    CLASSIC_PREFIX: load = CLASSIC_PREFIX, type = ro;
    CLASSIC_LEVELS: load = CLASSIC_LEVELS, type = ro;
    PRG1_HI:        load = PRG1_HI,        type = ro;
    CHR0:    load = CHR0,    type = ro;
    CHR1:    load = CHR1,    type = ro;
}
